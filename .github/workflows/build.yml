name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o PlantRescue-shell.zip

      - name: Write local.properties with API key
        run: echo "PLANTNET_API_KEY=${{ secrets.PLANTNET_API_KEY }}" >> PlantRescue/local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --project-dir=PlantRescue

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: plant-rescue-debug-apk
          path: PlantRescue/app/build/outputs/apk/debug/app-debug.apk
